[package]
name = "agent-cat"
# The distributable app version comes from ../package.json via tauri.conf.json.
version = "0.0.0"
description = "An animated desktop companion for AI agents"
authors = ["Agent Cat contributors"]
edition = "2021"
publish = false

[lib]
name = "agent_cat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agent-cat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
plist = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
