<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Cat README showcase</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="showcase">
      <section class="workspace-window" aria-hidden="true">
        <div class="workspace-toolbar"><i></i><i></i><i></i><span>agent-cat</span></div>
        <div class="workspace-body">
          <aside><b></b><b></b><b></b><b></b><b></b></aside>
          <div class="code-lines">
            <span style="--line-width: 54%"></span><span style="--line-width: 73%"></span>
            <span style="--line-width: 42%"></span><span style="--line-width: 66%"></span>
            <span style="--line-width: 58%"></span><span style="--line-width: 78%"></span>
            <span style="--line-width: 48%"></span><span style="--line-width: 63%"></span>
          </div>
        </div>
      </section>
      <section class="settings-preview" aria-label="Agent Cat Codex settings">
        <iframe name="settings" src="/settings.html#codex" title="Agent Cat Codex settings"></iframe>
      </section>
      <section class="companion-demo" aria-label="Agent Cat with Codex status bubbles">
        <iframe class="status-frame" name="status" src="/status.html" title="Codex live status"></iframe>
        <iframe class="pet-frame" name="pet" src="/index.html" title="Agent Cat desktop pet"></iframe>
      </section>
    </main>
  </body>
</html>
