name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release_metadata.outputs.id }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: master
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      - name: Resolve created release ID
        id: release_metadata
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          release_id="${RELEASE_UPLOAD_URL#*/releases/}"
          release_id="${release_id%%/*}"
          if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
            echo "Could not extract a release ID from ${RELEASE_UPLOAD_URL}" >&2
            exit 1
          fi
          echo "id=${release_id}" >> "${GITHUB_OUTPUT}"

  build_macos_release:
    name: Build macOS release bundle
    needs: prepare_release
    if: needs.prepare_release.outputs.release_created == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload universal macOS bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Keep tauri-action in upload-only mode so it cannot overwrite release metadata.
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tauriScript: npm run tauri
          uploadUpdaterJson: false
          args: --target universal-apple-darwin

  build_windows_release:
    name: Build Windows release bundle
    needs: prepare_release
    if: needs.prepare_release.outputs.release_created == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Keep tauri-action in upload-only mode so it cannot overwrite release metadata.
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tauriScript: npm run tauri
          uploadUpdaterJson: false
          args: --bundles nsis

  publish_updater_manifest:
    name: Publish updater manifest
    needs: [prepare_release, build_macos_release, build_windows_release]
    if: needs.prepare_release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate combined updater manifest
        env:
          GITHUB_RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-updater-manifest.mjs "${{ needs.prepare_release.outputs.tag_name }}" latest.json

      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: |
          existing_asset_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name == "latest.json") | .id'
          )"
          if [[ -n "${existing_asset_id}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}"
          fi
          gh api --method POST \
            -H "Content-Type: application/json" \
            --input latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
